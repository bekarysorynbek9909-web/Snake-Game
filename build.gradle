plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bekarys.snakecube'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.bekarys.snakecube"
        minSdk 21
        targetSdk 35
        versionCode 4
        versionName "1.3"
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            storeFile file('release-key.jks')
            storePassword project.hasProperty('KEYSTORE_PASSWORD') ? KEYSTORE_PASSWORD : ''
            keyAlias project.hasProperty('KEY_ALIAS') ? KEY_ALIAS : ''
            keyPassword project.hasProperty('KEY_PASSWORD') ? KEY_PASSWORD : ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
